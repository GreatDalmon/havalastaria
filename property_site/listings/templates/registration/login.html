{% extends 'listings/base.html' %}

{% block title %}Login - Havalastaria{% endblock %}

{% block content %}
<div class="card narrow" style="max-width:440px;margin-top:40px">
  <h2>Welcome back</h2>
  <p class="ar" style="margin:-8px 0 20px">Log in to contact agents and manage your listings.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Log In</button>
  </form>
  <p class="alt">Don't have an account? <a href="{% url 'listings:register' %}">Register here</a></p>
</div>
{% endblock %}
