{% extends 'listings/base.html' %}

{% block content %}
<div class="card narrow">
  <h2>Edit Property Listing</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div style="display:flex;gap:10px">
      <button type="submit" class="btn" style="flex:1;padding:14px">Save Changes</button>
      <a href="{% url 'listings:property_detail' property.id %}" class="btn btn-quiet" style="flex:1;padding:14px">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
