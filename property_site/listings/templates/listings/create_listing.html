{% extends 'listings/base.html' %}

{% block content %}
<div class="card narrow">
  <h2>Create New Property Listing</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn" style="width:100%;padding:14px">Publish Listing</button>
  </form>
</div>
{% endblock %}
